
<html>
<head>
<title>Employee System (Beginner)</title>
</head>
<body>
<h2>Employee Management</h2>
Name: <input type="text" id="name"><br><br>
ID: <input type="number" id="id"><br><br>
Salary: <input type="number" id="salary"><br><br>
Department: <input type="text" id="dept"><br><br>
<button onclick="addEmployee()">Add Employee</button>
<hr>
<button onclick="showEmployees()">Display All</button>
<button onclick="highSalary()">Salary > 50000</button>
<button onclick="totalSalary()">Total Salary</button>
<button onclick="averageSalary()">Average Salary</button>
<button onclick="countDept()">Count Department</button>
<p id="output"></p>
<script>
let employees = [];
function addEmployee() {
let emp = {
name: document.getElementById("name").value,
id: document.getElementById("id").value,
salary: Number(document.getElementById("salary").value),
dept: document.getElementById("dept").value
};
employees.push(emp);
alert("Employee Added");
document.getElementById("name").value = "";
document.getElementById("id").value = "";
document.getElementById("salary").value = "";
document.getElementById("dept").value = "";
}
function showEmployees() {
let text = "All Employees:<br>";
for (let i = 0; i < employees.length; i++) {
text += employees[i].name + " | " +
employees[i].salary + " | " +
employees[i].dept + "<br>";
}
document.getElementById("output").innerHTML = text;
}
function highSalary() {
let text = "Salary > 50000:<br>";
for (let i = 0; i < employees.length; i++) {
if (employees[i].salary > 50000) {
text += employees[i].name + " | " +
employees[i].salary + "<br>";
}
}
document.getElementById("output").innerHTML = text; }
function totalSalary() {
let total = 0;
for (let i = 0; i < employees.length; i++) {
total += employees[i].salary;
}
document.getElementById("output").innerHTML =
"Total Salary = " + total;
}
function averageSalary() {
let total = 0;
for (let i = 0; i < employees.length; i++) {
total += employees[i].salary;}
let avg = total / employees.length;
document.getElementById("output").innerHTML =
"Average Salary = " + avg;}
function countDept() {
let deptName = prompt("Enter Department:");
let count = 0;
for (let i = 0; i < employees.length; i++) {
if (employees[i].dept == deptName) {
count++;
}}
document.getElementById("output").innerHTML =
"Employees in " + deptName + " = " + count; }
</script>
</body>
</html>
