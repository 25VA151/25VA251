    <script>
    //function in jawasript, a function is a reusable block of code designed to perform a specific task.
    //normal fuction
    //without parameters
    function demo(){
        console.log("Hello 25")};
       
    function demo1(){
        console.log("text")
    }
    
    demo();//function calling
    function cal1(a,b){
        console.log("Addition of two numbers is" + (a+b));
    }
    demo1();
    cal1(1,4);
    demo();
    //anonymous funtion important
     let add=(a,b)=>{
        console.log("First number is" + a) ;
        console.log("Secound number is " + b );
        console.log("Addition of two is " + (a+b));
     }
     //callback function:-
     function mul(callback){
        var num1=10;
        console.log("First value is " + null);
        var num2=20;  
        console.log("Secound value is " + null);
        var res=num1*num2;
        callback(res); 
     }
     function result(){

     }

        document.write("Hello");
     }

     //nap filter reduce
     let num=[1,2,4,5];
     let finalResult=num.map(n=>n*2);
     console.log(finalResult);



     let finalResult2=num.reduce((total,n)=>total+n );
